[package]
name = "codetake"
version = "0.1.0"
description = "Record your code. A local-first screen and webcam recorder for developers."
authors = ["CodeTake contributors"]
license = "MIT"
repository = "https://github.com/sebastianfelipe/codetake"
edition = "2021"
rust-version = "1.85"

[lib]
name = "codetake_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

