name: Release

# Builds the installers for a release and attaches them to its GitHub
# Release. Normally started by the Release Please workflow right after it
# creates the vX.Y.Z tag and release; it can also be run by hand (Actions →
# Release → Run workflow) to rebuild the installers of an existing tag.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.2.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, e.g. v0.2.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      # The installers are named after the version in the app's files, so a
      # tag that doesn't match them would publish mislabeled artifacts.
      - name: Tag matches the app version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          app=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          package=$(node -p "require('./apps/desktop/package.json').version")
          crate=$(grep -m1 '^version' apps/desktop/src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=$TAG tauri.conf.json=$app package.json=$package Cargo.toml=$crate"
          for version in "$app" "$package" "$crate"; do
            if [ "v$version" != "$TAG" ]; then
              echo "::error::Tag $TAG does not match version $version in the app's files"
              exit 1
            fi
          done

  build:
    needs: verify
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One .dmg that runs natively on Apple silicon and Intel Macs.
          - name: macOS (universal)
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      # Produces .dmg/.app on macOS, .msi/.exe on Windows, and .AppImage,
      # .deb and .rpm on Linux, and uploads them to the tag's existing
      # release (created by Release Please, with the changelog as its notes).
      # Windows and Linux builds report recording as not implemented yet.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # For signed, notarized macOS builds, add these repository secrets:
          # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # Falls back to ad-hoc signing ("-") when no Developer ID is configured.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ inputs.tag }}
          releaseName: CodeTake ${{ inputs.tag }}
          releaseDraft: false
          prerelease: false
