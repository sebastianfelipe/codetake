name: Release

# Builds the installers for a release, attaches them to its GitHub Release
# and publishes it. Normally started by the Release Please workflow right
# after it creates the vX.Y.Z tag and draft release; it can also be run by
# hand (Actions → Release → Run workflow) for an existing tag, e.g. to
# rebuild installers or retry after a failed build.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.2.0
        required: true
        type: string
      release-id:
        description: ID of the (draft) GitHub Release to upload to
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, e.g. v0.2.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      # The installers are named after the version in the app's files, so a
      # tag that doesn't match them would publish mislabeled artifacts.
      - name: Tag matches the app version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          app=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          package=$(node -p "require('./apps/desktop/package.json').version")
          crate=$(grep -m1 '^version' apps/desktop/src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=$TAG tauri.conf.json=$app package.json=$package Cargo.toml=$crate"
          for version in "$app" "$package" "$crate"; do
            if [ "v$version" != "$TAG" ]; then
              echo "::error::Tag $TAG does not match version $version in the app's files"
              exit 1
            fi
          done
      # Draft releases can't be looked up by tag, so find the release's ID
      # (given by Release Please, or looked up for manual runs).
      - name: Find the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          GIVEN_ID: ${{ inputs.release-id }}
        run: |
          id="$GIVEN_ID"
          if [ -z "$id" ]; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          fi
          if [ -z "$id" ]; then
            echo "::error::No GitHub Release found for $TAG"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
    outputs:
      release-id: ${{ steps.release.outputs.id }}

  build:
    needs: verify
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One .dmg that runs natively on Apple silicon and Intel Macs.
          - name: macOS (universal)
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      # Produces .dmg/.app on macOS, .msi/.exe on Windows, and .AppImage,
      # .deb and .rpm on Linux, and uploads them to the tag's release
      # (created by Release Please, with the changelog as its notes).
      # Windows and Linux builds report recording as not implemented yet.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # For signed, notarized macOS builds, add these repository secrets:
          # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # Falls back to ad-hoc signing ("-") when no Developer ID is configured.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          releaseId: ${{ needs.verify.outputs.release-id }}

  # Publish only once every installer is attached. If a build fails, the
  # release stays a draft; fix it and re-run this workflow for the tag.
  publish:
    name: Publish release
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.verify.outputs.release-id }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false \
            --jq '"Published \(.tag_name): \(.html_url)"'
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --jq '"Assets: " + ([.assets[].name] | join(", "))'
